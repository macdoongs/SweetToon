services:
  clamav:
    image: clamav/clamav:stable_base
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - clamav-db:/var/lib/clamav

  server:
    environment:
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  clamav-db:
