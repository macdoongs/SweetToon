services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweettoon
      POSTGRES_PASSWORD: sweettoon
      POSTGRES_DB: sweettoon
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweettoon -d sweettoon"]
      interval: 3s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://sweettoon:sweettoon@db:5432/sweettoon
      PORT: 4000
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://server:4000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  db-data:
  uploads:
