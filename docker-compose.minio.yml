services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sweettoon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sweettoon-local-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sweettoon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sweettoon-local-secret}
      MINIO_BUCKET: ${R2_BUCKET:-sweettoon-assets}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set download "local/$${MINIO_BUCKET}"

  server:
    environment:
      ASSET_STORAGE_PROVIDER: r2
      R2_ENDPOINT: http://minio:9000
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sweettoon}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-sweettoon-local-secret}
      R2_BUCKET: ${R2_BUCKET:-sweettoon-assets}
      R2_PUBLIC_BASE_URL: http://localhost:${MINIO_PORT:-9000}/${R2_BUCKET:-sweettoon-assets}
      R2_FORCE_PATH_STYLE: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
