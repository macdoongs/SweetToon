services:
  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweettoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweettoon}
      POSTGRES_DB: ${POSTGRES_DB:-sweettoon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweettoon -d sweettoon"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ./server
      target: migrate
    command: sh -c "npx prisma migrate deploy && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweettoon}:${POSTGRES_PASSWORD:-sweettoon}@db:5432/${POSTGRES_DB:-sweettoon}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./server
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweettoon}:${POSTGRES_PASSWORD:-sweettoon}@db:5432/${POSTGRES_DB:-sweettoon}
      PORT: 4000
      UPLOAD_DIR: /app/data/uploads
      PRINT_PROVIDER: ${PRINT_PROVIDER:-mock}
      ASSET_STORAGE_PROVIDER: ${ASSET_STORAGE_PROVIDER:-filesystem}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379
      REALTIME_BOT_ENABLED: ${REALTIME_BOT_ENABLED:-true}
      REALTIME_BOT_AUTO_START: ${REALTIME_BOT_AUTO_START:-true}
      REALTIME_BOT_READER_COUNT: ${REALTIME_BOT_READER_COUNT:-8}
      REALTIME_BOT_SPEED: ${REALTIME_BOT_SPEED:-normal}
      API_SECURITY_MODE: ${API_SECURITY_MODE:-demo}
      STUDIO_API_KEY: ${STUDIO_API_KEY:-}
      OPERATIONS_API_KEY: ${OPERATIONS_API_KEY:-}
      AUDIT_HASH_SECRET: ${AUDIT_HASH_SECRET:-}
      MALWARE_SCANNER: ${MALWARE_SCANNER:-none}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://server:4000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://server:4000
      SITE_URL: ${SITE_URL:-https://sweettoon.katsuranbo.com}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  db-data:
  uploads:
