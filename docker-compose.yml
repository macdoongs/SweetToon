services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweettoon
      POSTGRES_PASSWORD: sweettoon
      POSTGRES_DB: sweettoon
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweettoon -d sweettoon"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  db-data:
